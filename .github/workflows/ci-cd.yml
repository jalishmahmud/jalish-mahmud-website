name: CI/CD

on:
  pull_request:
    branches:
      - production

  push:
    branches:
      - production

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: validate

    if: >
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure known host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure application directory exists
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        run: |
          ssh -p "${EC2_PORT:-22}" \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '${EC2_APP_DIR}'"

      - name: Upload application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude '.env*' \
            -e "ssh -p ${EC2_PORT:-22}" \
            ./ "${EC2_USER}@${EC2_HOST}:${EC2_APP_DIR}/"

      - name: Install, build, and restart application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
        run: |
          ssh -p "${EC2_PORT:-22}" "${EC2_USER}@${EC2_HOST}" "
            export NVM_DIR=\"\$HOME/.nvm\" &&
            [ -s \"\$NVM_DIR/nvm.sh\" ] &&
            . \"\$NVM_DIR/nvm.sh\" &&
            cd '${EC2_APP_DIR}' &&
            nvm use &&
            npm ci &&
            npm run build &&
            if pm2 describe '${PM2_APP_NAME}' >/dev/null 2>&1; then
              pm2 reload '${PM2_APP_NAME}'
            else
              pm2 start npm --name '${PM2_APP_NAME}' -- start
            fi &&
            pm2 save
          "

      - name: Verify application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
        run: |
          sleep 5
          ssh -p "${EC2_PORT:-22}" "${EC2_USER}@${EC2_HOST}" \
            "curl --fail --silent http://127.0.0.1:3000 > /dev/null"